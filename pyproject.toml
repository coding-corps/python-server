[tool.poetry]
name = "cooking-compass"
version = "0.1.0"
description = "A backend server for Cooking Compass, offering recipe recommendations, user profiles, and point tracking."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://yourprojecthomepage.com"
repository = "https://github.com/yourusername/cooking-compass"
keywords = ["recipes", "cooking", "backend", "python", "flask"]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^2.3.0"
flask-sqlalchemy = "^3.0.0"
flask-jwt-extended = "^4.4.0"
marshmallow = "^3.20.0"
marshmallow-sqlalchemy = "^0.28.0"
gunicorn = "^21.0.0"  # For production
python-dotenv = "^1.0.0"  # For environment variables
werkzeug = "^2.3.0"

[tool.poetry.dev-dependencies]
pytest = "^7.5.0"
pytest-flask = "^1.5.0"
flake8 = "^6.1.0"  # For linting
black = "^23.1.0"  # For code formatting
isort = "^5.12.0"  # For import sorting
mypy = "^1.6.0"  # For type checking

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[scripts]
start = "python app/main.py"
