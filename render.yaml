services:
  - type: web
    name: my-flask-app
    env: docker
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: "python app.py"
    environment:
      MYSQL_HOST: mysql  # Referencing MySQL database as an environment variable
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_PORT: 3306
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    instanceType: "small"  # Adjust based on your app's needs
    regions:
      - oregon

# Optional: To manage persistence for your MySQL database on Render
volumes:
  - name: mysql-data
    driver: local
