# Define services for your Flask app and MySQL database
services:
  # Web service for Flask app (running Docker)
  - type: web
    name: my-flask-app
    runtime: docker
    dockerfilePath: Dockerfile  # Path to your Dockerfile
    buildCommand: ""  # Render will use Dockerfile to build
    scaling:
      minInstances: 1  # Fixed to 1 instance for the free tier
      maxInstances: 1  # Fixed to 1 instance for the free tier
    plan: free  # Free tier for the Flask web service
    autoDeploy: true  # Enable auto-deploy when changes are made
    envVars:
      - key: MYSQL_HOST
        value: mysql  # Use MySQL service name as hostname
      - key: MYSQL_USER
        value: ${MYSQL_USER}
      - key: MYSQL_PASSWORD
        value: ${MYSQL_PASSWORD}
      - key: MYSQL_DB
        value: ${MYSQL_DB}
      - key: MYSQL_PORT
        value: "3306"  # Internal MySQL port
      - key: FLASK_ENV
        value: ${FLASK_ENV}
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: JWT_SECRET_KEY
        value: ${JWT_SECRET_KEY}

  # MySQL database service (free tier)
  - type: pserv
    name: mysql-db
    plan: free  # Use the free plan for MySQL
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: ${MYSQL_PASSWORD}  # Set MySQL root password
      - key: MYSQL_DATABASE
        value: ${MYSQL_DB}  # Database name
      - key: MYSQL_USER
        value: ${MYSQL_USER}  # MySQL user
      - key: MYSQL_PASSWORD
        value: ${MYSQL_PASSWORD}  # MySQL password

# No need for explicit volumes section, Render will handle persistence for databases automatically
